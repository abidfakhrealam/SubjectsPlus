# SubjectsPlus 4.6.0 — hardened Nginx server block (equivalent of the shipped .htaccess files).
#
# Install: copy to /etc/nginx/sites-available/subjectsplus, adjust server_name, root, the PHP-FPM
# socket and the TLS certificate paths, then:
#   ln -s /etc/nginx/sites-available/subjectsplus /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# SubjectsPlus is served from the web root here (https://library.edu/control/, /subjects/, /api/).
# For a sub-folder install (https://library.edu/sp/) prefix every "location" path below with /sp.

server {
    listen 80;
    listen [::]:80;
    server_name library.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name library.edu;

    ssl_certificate     /etc/ssl/certs/library.edu.pem;
    ssl_certificate_key /etc/ssl/private/library.edu.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/subjectsplus;
    index index.php index.html;
    charset utf-8;

    # uploads (CKEditor images, headshots, record files, Excel/CSV imports)
    client_max_body_size 24m;
    server_tokens off;

    # ---- security headers (same as .htaccess)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- never serve dotfiles (.git, .env, .htaccess …) or source/config/build files
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(md|lock|dist|ini|log|sql|sh|ps1|bak|swp|orig|ya?ml|ser|phar|inc)$ { return 404; }
    location ~* /(composer|package|package-lock)\.json$ { return 404; }
    location ~* ^/(lib|tools|build|tests|docs|node_modules)(/|$) { return 404; }
    location ^~ /control/lti_controller/ { return 404; }
    location ^~ /assets/records/ { return 404; }   # record files are served by control/records/field_file.php
    location = /control/migrate_to_v1_from_v09.php { return 404; }

    # ---- control/includes: only the scripts that browsers call directly
    location ^~ /control/includes/ {
        location ~ ^/control/includes/(css|js_vendor|js_custom|configErrorPage|autocomplete_data|asset_manager_upload|set_bio|set_image|set_password|set_picture|config_bits|linkchecker)\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
        location ^~ /control/includes/images/ { try_files $uri =404; }
        return 404;
    }

    # ---- bundled images (icons are SVG): never run scripts from here
    location ~* ^/assets/images/ {
        location ~* \.(php\d?|phtml|phar|pht|cgi|pl|py|sh)$ { return 404; }
        try_files $uri =404;
    }

    # ---- uploads and caches: static files only, never PHP or active content (SVG/HTML can carry script)
    location ~* ^/assets/(users|cache)/ {
        location ~* \.(php\d?|phtml|phar|pht|cgi|pl|py|sh|svg|html?|xhtml)$ { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    # ---- static assets
    location ~* \.(css|js|png|jpe?g|gif|ico|webp|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---- REST API (api/<service>/<param>/<value>/key/<key>) — same as api/.htaccess
    location /api/ {
        try_files $uri $uri/ /api/index.php?$args;
    }

    # ---- public pages; optional pretty guide URLs (/subjects/<shortform>) like subjects/.htaccess-default
    location /subjects/ {
        try_files $uri $uri/ @sp_guide;
    }
    location @sp_guide {
        rewrite ^/subjects/([^/.]+)/?$ /subjects/guide.php?subject=$1 last;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- PHP via PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;            # Debian/Ubuntu; it already does try_files $fastcgi_script_name =404
        # Other distributions: replace the include with
        #   try_files $uri =404; fastcgi_split_path_info ^(.+\.php)(/.+)$; include fastcgi_params;
        #   fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # e.g. php8.1-fpm / php8.2-fpm / php8.4-fpm
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 300;                     # Excel imports, link checker
        fastcgi_hide_header X-Powered-By;
    }
}
