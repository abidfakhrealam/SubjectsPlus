# SubjectsPlus 4.6.0 — Apache 2.4 virtual host. The detailed rules live in the .htaccess files that
# ship with SubjectsPlus (root, lib/, tools/, assets/users/, assets/cache/, assets/records/, api/),
# so AllowOverride must permit them.
#
#   a2enmod rewrite headers ssl proxy_fcgi setenvif && a2enconf php8.3-fpm
#   cp docs/server/apache-subjectsplus.conf /etc/apache2/sites-available/subjectsplus.conf
#   a2ensite subjectsplus && apachectl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName library.edu
    Redirect permanent / https://library.edu/
</VirtualHost>

<VirtualHost *:443>
    ServerName library.edu
    DocumentRoot /var/www/subjectsplus

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/library.edu.pem
    SSLCertificateKeyFile /etc/ssl/private/library.edu.key

    <Directory /var/www/subjectsplus>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and braces: the same protections without relying on .htaccess
    <DirectoryMatch "^/var/www/subjectsplus/(lib|tools|build|tests|docs|assets/records|control/lti_controller)/">
        Require all denied
    </DirectoryMatch>
    <Directory /var/www/subjectsplus/assets/users>
        <FilesMatch "\.(php\d?|phtml|phar|pht|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # PHP-FPM (recommended). With mod_php instead, drop this block.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Optional: staff area only from campus / VPN
    # <Directory /var/www/subjectsplus/control>
    #     Require ip 10.0.0.0/8 192.168.0.0/16
    # </Directory>

    # Optional SAML / Shibboleth: protect only the return page
    # <Location /control/auth-saml.php>
    #     AuthType shibboleth
    #     ShibRequestSetting requireSession 1
    #     Require shib-session
    # </Location>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    ErrorLog  ${APACHE_LOG_DIR}/subjectsplus-error.log
    CustomLog ${APACHE_LOG_DIR}/subjectsplus-access.log combined
</VirtualHost>
