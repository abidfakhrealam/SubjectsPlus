# Continuous integration: syntax on PHP 8.1–8.5, then the real-browser suite (Playwright) on two stacks,
# desktop and mobile viewports, strict SQL mode:
#   - Apache 2.4 + PHP 8.3 (mod_php) + MariaDB 10.11, existing database
#   - Nginx (docs/server/nginx-subjectsplus.conf) + PHP 8.4-FPM + MySQL 8.4, database created by the wizard
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          out=$(find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 50 -P 4 php -d error_reporting=E_ALL -l 2>&1 | grep -v '^No syntax errors detected' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan:2.1
      - name: PHPStan (level 1; phpstan-baseline.neon holds the problems known in 4.7.1 — new code must be clean)
        run: phpstan analyse --no-progress --memory-limit=2G -c phpstan.neon.dist

  e2e:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sp
          MARIADB_USER: sp
          MARIADB_PASSWORD: sp-ci-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Apache 2.4 + PHP 8.3 (Ubuntu packages)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apache2 libapache2-mod-php8.3 php8.3-mysql php8.3-mbstring php8.3-curl php8.3-gd php8.3-xml php8.3-intl mariadb-client
          sudo a2enmod rewrite headers
          sudo rm -rf /var/www/html && sudo cp -a "$GITHUB_WORKSPACE" /var/www/html
          sudo sed -i "s/^\$sp_db_sql_mode = .*/\$sp_db_sql_mode = 'server';/" /var/www/html/control/includes/config-default.php
          printf '<Directory /var/www/html>\n  AllowOverride All\n</Directory>\n' | sudo tee /etc/apache2/conf-enabled/sp.conf
          sudo rm -f /var/www/html/control/includes/config.php
          sudo chown -R www-data:www-data /var/www/html
          sudo systemctl restart apache2
      - name: Strict SQL mode on the server
        run: mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_mode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Install code for the installer wizard
        run: |
          code=$(sudo -u www-data php /var/www/html/tools/install-code.php | grep -oE '[A-Z0-9]{4}(-[A-Z0-9]{4}){3}')
          echo "SP_INSTALL_CODE=$code" >> "$GITHUB_ENV"
      - name: Install SubjectsPlus through the wizard and run the browser suite (existing database)
        env:
          SP_BASE: http://localhost
          SP_DB_HOST: 127.0.0.1
          SP_DB_USER: sp
          SP_DB_PASS: sp-ci-pass
          SP_DB_NAME: sp
        run: node tests/e2e/sp-e2e.cjs --install --label ci-apache-php8.3-mariadb10.11
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/results/

  e2e-nginx:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci-pass" --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Nginx + PHP 8.4-FPM
        run: |
          set -euo pipefail
          # Launchpad (which serves the PPA) sometimes times out: try a few times
          for i in 1 2 3 4 5; do sudo add-apt-repository -y ppa:ondrej/php && break; [ "$i" = 5 ] && exit 1; echo "PPA not reachable, retrying in 20 s"; sleep 20; done
          sudo apt-get update -q
          sudo apt-get install -y -q nginx php8.4-fpm php8.4-mysql php8.4-mbstring php8.4-curl php8.4-gd php8.4-xml php8.4-intl php8.4-zip mysql-client
          sudo rm -rf /var/www/html && sudo cp -a "$GITHUB_WORKSPACE" /var/www/html
          sudo sed -i "s/^\$sp_db_sql_mode = .*/\$sp_db_sql_mode = 'server';/" /var/www/html/control/includes/config-default.php
          sudo rm -f /var/www/html/control/includes/config.php /etc/nginx/sites-enabled/default
          sh tests/ci/nginx-ci-conf.sh /var/www/html /run/php/php8.4-fpm.sock 80 | sudo tee /etc/nginx/sites-enabled/subjectsplus > /dev/null
          sudo nginx -t
          sudo chown -R www-data:www-data /var/www/html
          sudo systemctl restart php8.4-fpm nginx
          curl -sS -o /dev/null -w 'site answers HTTP %{http_code}\n' http://localhost/
      - name: Strict SQL mode and a database administrator for the wizard
        run: |
          mysql -h127.0.0.1 -uroot -proot-ci-pass -e "SET GLOBAL sql_mode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';
            CREATE USER 'spadmin'@'%' IDENTIFIED BY 'spadmin-ci-pass'; GRANT ALL PRIVILEGES ON *.* TO 'spadmin'@'%' WITH GRANT OPTION;"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Install code for the installer wizard
        run: |
          code=$(sudo -u www-data php /var/www/html/tools/install-code.php | grep -oE '[A-Z0-9]{4}(-[A-Z0-9]{4}){3}')
          echo "SP_INSTALL_CODE=$code" >> "$GITHUB_ENV"
      - name: Wizard creates the database and its user, then the browser suite
        env:
          SP_BASE: http://localhost
          SP_DB_HOST: 127.0.0.1
          SP_DB_ADMIN_USER: spadmin
          SP_DB_ADMIN_PASS: spadmin-ci-pass
        run: node tests/e2e/sp-e2e.cjs --install --label ci-nginx-php8.4-mysql8.4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-nginx
          path: tests/e2e/results/
